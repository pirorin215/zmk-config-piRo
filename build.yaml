# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
---
# 2026-09-10: ZMK が Zephyr 4.1 移行でボード命名変更——旧 seeeduino_xiao_ble は
# 新書式 xiao_ble//zmk （board[@rev]/qualifier/variant・qualifier空）が正解。
# 素名/ベンダー接頭辞付きは CMake "Invalid BOARD"/"Missing ZMK Compat" で落ちる
# （8/28 のビルド失敗も同根）。実例: caksoylar/zmk-config の build.yaml。
# 参考: https://zmk.dev/blog/2025/12/09/zephyr-4-1#zmk-board-variant
include:
  - board: xiao_ble//zmk
    shield: piRo_R rgbled_adapter
  - board: xiao_ble//zmk
    shield: piRo_L rgbled_adapter
  - board: xiao_ble//zmk
    shield: settings_reset
