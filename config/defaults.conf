# ---- 2026-09-10: ペアリング不能（PINまたはパスキーが正しくない）対策 ----
# Zephyrの仕様で「未認証(Just Works)で保存済みのbondを、別のJust Works
# ペアリングで上書き」しようとすると SMP Pairing Failed 0x03 で拒否され、
# ホスト側が「PINまたはパスキーが正しくない」と表示して再ペアが一切通ら
# なくなる（ホスト側のbond喪失/削除後に発生）。このオプションで上書きを
# 許可すると、ホスト側でデバイス削除→再ペアだけでキーボード側の
# BT_CLR/BT_CLR_ALL なしで回復するようになる。
# 参考: https://zmk.dev/docs/behaviors/bluetooth （"It will not replace
# this when you initiate pairing with another device" の記述がこの挙動）
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
